# 将本文件复制为 ~/.wechat-report/config.yaml；只填写本人允许处理的数据路径。
timezone: Asia/Shanghai
week_start: monday
source:
  type: decrypted_dir
  path: ""  # 明文 SQLite 镜像目录；也可以命令行提供 --source-dir
  account: ""
me:
  ids: []
  names: []   # 可填本人在微信群中的昵称，例如 ["我的昵称"]
group_sets: {}
output:
  root: "~/Documents/wechat-summary"
  chunk_messages: 1500
  text_limit: 600
render:
  themes: ["newspaper"]
  formats: ["md", "html"]
