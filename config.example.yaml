# wxsummary V1.1，本机授权数据接入示例
timezone: Asia/Shanghai
week_start: monday
source:
  type: decrypted_dir
  path: ""
  account: ""
  paths: {}
refresh:
  command: []
  cwd: ""
  timeout_seconds: 1800
